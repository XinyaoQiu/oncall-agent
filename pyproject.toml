[project]
name = "oncall-agent"
version = "2.0.0"
description = "On-call triage agent: a LangGraph plan-execute-replan graph over MCP tools, summoned from Slack"
requires-python = ">=3.11,<3.14"
dependencies = [
    # agent
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-mcp-adapters>=0.2.1",
    "fastmcp>=2.14.0",
    # models
    "langchain-openai>=1.0.0",
    "langchain-qwq>=0.3.4",
    "dashscope>=1.14.0",
    # retrieval
    "pymilvus>=2.3.5",
    "langchain-milvus>=0.3.3",
    "langchain-text-splitters>=1.1.0",
    # service
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.1.0",
    # slack
    "slack-bolt>=1.30",
    "aiohttp>=3.9.0",
    # plumbing
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0",
    "psycopg[binary,pool]>=3.3.4",
    "httpx>=0.27",
    "typer>=0.12",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # retained by src/oncall_agent during the migration; removed with it at step 13
    "google-genai>=1.0.0",
]

[project.scripts]
oncall = "app.cli:main"
oncall-api = "app.main:run"
oncall-slackd = "app.slack.run:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both packages are installed during the migration so the pre-rewrite suite keeps
# running. src/oncall_agent is deleted at migration step 13.
packages = ["app", "src/oncall_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
