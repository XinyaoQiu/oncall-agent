[project]
name = "oncall-agent"
version = "0.1.0"
description = "On-call triage agent: Slack-summoned alert analysis with knowledge write-back"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "slack-bolt>=1.20",
    "typer>=0.12",
]

[project.scripts]
oncall-agent = "oncall_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall_agent"]
