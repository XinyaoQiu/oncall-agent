# Known alerts and their cheap benign checks. Each how_to_check is a one-line
# distillation of a real multi-hour investigation.
# Ported from src/oncall_agent/alerts.py:KNOWN_ALERTS.
alerts:
- name: news-list-for-channel-p99
  keywords:
  - news-list-for-channel
  - channel latency
  - channel p99
  fallback_expr: histogram_quantile(0.99, sum(rate(server_api_delay_bucket{path="/Website/channel/news-list-for-channel"}[5m]))
    by (le, app))
  benign_patterns:
  - name: deploy cold start
    description: New server-feed pods warming up after a deploy; self-heals in ~10min
    how_to_check: kube_pod_start_time for server-feed against the alert window
  knowledge_terms:
  - news-list-for-channel
  - server-feed
  - cold start
  - warmup
- name: feed-channel-empty
  keywords:
  - channel empty
  - feed channel empty
  - empty channel
  fallback_expr: sum(rate(feed_empty_total[5m])) by (channel_id, cv)
  benign_patterns:
  - name: runaway client
    description: A single old client looping a cold endpoint produces empty channel_id
    how_to_check: split by channel_id="" and client_ip; do not trust topk
  - name: ancient client deep pagination
    description: cv 3.1.x iOS deep-paginating the Headline tab (k26164) into empty
      pages
    how_to_check: compare cv distribution during the spike against baseline
  knowledge_terms:
  - feed channel empty
  - news-list-for-following
  - channel_id
  - NPP
- name: get-empty-docids
  keywords:
  - get_empty_docids
  - empty docids
  - empty_docids
  fallback_expr: sum(rate(get_empty_docids_total[5m])) by (host)
  benign_patterns:
  - name: D2D failover
    description: Failover produces empty docids without a real fault
    how_to_check: prod-fe ingress top-IP by x-forward-for (downstream strips it)
  knowledge_terms:
  - get_empty_docids
  - D2D
  - failover
  - prod-fe
- name: large-scale-5xx
  keywords:
  - 5xx
  - error rate
  - high error
  - '500'
  fallback_expr: sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) by
    (host)
  benign_patterns:
  - name: ingress reload
    description: An nginx reload triggered by scaling can drop capacity; looks like
      an attack
    how_to_check: ingress restart events and DNS resolution failures in the window
  knowledge_terms:
  - 5xx
  - ingress
  - HPA
  - memcache
  - OOM
